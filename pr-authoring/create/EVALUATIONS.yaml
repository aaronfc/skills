version: 1
scenarios:
  - id: review_only
    user_message: Review PR 42 for bugs.
    rubric:
      - Treats this as review work and leaves the PR title, description, and readiness alone.

  - id: small_draft
    user_message: |
      Open the first PR for this branch. It fixes "conection" in the README.
      Our template has Summary and Testing, and the guide asks for ready PRs.
      git diff --check passed. GitHub returns https://github.com/example/docs/pull/7.
    must_include:
      - 'gh pr create\b[^\n]*--draft\b'
    rubric:
      - Returns the new PR link to the user.
      - Keeps both template sections and adds separate Testing Steps and Proofs.
      - Gives one way to inspect the corrected word and reports the observed check once.

  - id: update_the_evidence
    user_message: |
      Update ready PR 42. The old title and body promise Redis. The final diff
      only adds account IDs to cache keys, one part of issue 91. No PR template.
      Run ./demo with two accounts. It showed A=hello B=hello before and
      A=hello B=hola after. pytest tests/cache reported one concurrent-write failure.
      Show the replacement title and body.
    rubric:
      - Rewrites the title and body around the two accounts' results and links issue 91 as related.
      - Gives the demo and expected result under Testing Steps, then the observed outputs and failed check under Proofs.
      - Checks the branch commits and preserves the existing ready state.

  - id: missing_ui_proof
    user_message: |
      Update draft PR 43 for the mobile settings fix. The old body says the page
      fits at 375px. No one has tried the screenshot helper yet. When called,
      it will return "browser unavailable." npm test reported 8 passed.
      Show the updated Proofs section.
    rubric:
      - Calls aa:create-pr:screenshots for visual evidence.
      - The updated Proofs section gives the browser error in place of the visual claim.
      - The same section reports 8 passing tests.

  - id: explain_the_change
    user_message: |
      Draft a PR description for someone new to WordPress. Changing the sender
      name now affects the next email. WordPress lets plugins change the name
      just before sending. We use that standard filter and chose to read the
      saved name each time. A preview showed the new name. We haven't tested
      real delivery.
    rubric:
      - Starts with the next email and explains the filter in words an email user can follow.
      - Explains that WordPress provides the filter and the plugin reads the saved name on each send.
      - Reports the preview result and identifies real delivery as untested.
