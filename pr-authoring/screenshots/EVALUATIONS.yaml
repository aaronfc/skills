version: 1
scenarios:
  - id: compare_settings
    user_message: |
      Add before and after screenshots of the settings page to PR 42.
      It requires login. Keep the existing description.
    rubric:
      - Signs in or restores a saved session in Playwright, then captures the same settings state on both revisions.
      - Saves desktop (1354×896) and mobile (390×844) PNGs to absolute paths outside the repository.
      - Uses publish-pr-media.sh and adds its pinned raw links in a Before | After table for each viewport, preserving the PR text.

  - id: show_the_motion
    user_message: |
      PR 43 slows the drawer animation. Can you show the new timing in the PR?
    rubric:
      - Records the drawer opening in Playwright and attaches the video or a GIF without committing the media.

  - id: preserve_the_conversation
    user_message: |
      PR 44 restyles a chat card that is hard to trigger twice. The conversation
      survives a reload. Show the docked layout, which only appears at 1500px.
    rubric:
      - Reuses the saved conversation across a verified bundle swap so both captures show the same card at 1500px.
      - Restores the PR bundle after capturing the old version.
