version: 1
scenarios:
  - id: ordinary_review
    user_message: Review the unstaged changes in this checkout for bugs.
    rubric:
      - Proceeds with an ordinary review without activating the four specialist passes.

  - id: passing_tests_miss_zero
    user_message: |
      /aa:review-code. Only None should trigger a fetch. At src/cache.py:18
      get_cached(cached, fetch) calls fetch() if cached is None or cached == 0.
      pytest tests/test_cache.py covers None and 7. You can import get_cached
      from src.cache in the local Python shell. A reviewer already flagged 0.
    rubric:
      - Runs the four independent passes for changed-line security, system security, consistency, and simplicity, and waits for them.
      - The main reviewer runs the tests and directly checks zero and False against the requested behavior.
      - Reports the known issue once with priority, location, and the fix to remove the equality check. Leaves the code unchanged.

  - id: reject_an_unrelated_finding
    user_message: |
      /aa:review-code. The diff renames a local variable and updates every
      reference. A reviewer flags a bug in an unrelated, unreachable module.
      Unit tests can run. Integration tests need an unavailable database.
    rubric:
      - Verifies the claim against the diff and reports "No findings." for the rename.
      - Runs the unit tests and identifies the blocked integration check.
