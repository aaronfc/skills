version: 1
scenarios:
  - id: basic_pr_draft_checks_template
    user_message: |
      /aa:create-pr
    must_include:
      - 'Bash: git (status|diff|log).*'
      - '(Glob|Read): .*PULL_REQUEST_TEMPLATE.*'
    must_not_include:
      - 'Bash: rm .*'
      - 'Bash: git push.*--force.*'
    rubric:
      - 'The plan inspects the current branch state (git status/diff/log) before drafting.'
      - 'The plan checks for a repository PR template under .github/ (and optionally docs/) before deciding on a structure.'
      - 'The drafted PR body leads with Why (motivation/problem) before What (summary of changes).'

  - id: open_pr_with_gh
    user_message: |
      Please open a PR for the current branch.
    must_include:
      - 'Bash: git .*'
      - '(Glob|Read): .*PULL_REQUEST_TEMPLATE.*'
      - 'Bash: gh pr (create|view|edit).*'
    rubric:
      - 'The plan gathers diff/commit context with git before composing the PR body.'
      - 'The plan uses the gh CLI to actually open the PR rather than only printing text.'
      - 'The PR body follows the repo template if found, otherwise Why → What → references.'

  - id: branch_name_contains_issue
    user_message: |
      Create a PR for these changes. My branch is `fix/1234-broken-login`.
    must_include:
      - 'Bash: git .*'
    rubric:
      - 'The draft includes a `Fixes #1234` (or `Relates to #1234`) reference derived from the branch name.'
      - 'The issue reference is the first content in the PR description, before Why, What, template sections, or other prose.'

  - id: ui_changes_triggers_screenshot
    user_message: |
      Update the current PR for these changes — I just reworked the settings page styles and a couple of React components in the dashboard.
    must_include:
      - 'Bash: git (diff|status|log).*'
    rubric:
      - 'The plan recognizes the diff touches the UI and invokes or recommends /aa:create-pr:screenshots.'
      - 'The plan inspects the actual diff to confirm UI files are affected rather than relying solely on the user message.'

  - id: backend_only_no_screenshot
    user_message: |
      Draft a PR for my branch. It only changes a database migration and a backend service — no UI at all.
    must_include:
      - 'Bash: git (diff|status|log).*'
    must_not_include:
      - 'aa:create-pr:screenshots'
    rubric:
      - 'The plan does not invoke /aa:create-pr:screenshots for a backend-only change.'
      - 'The drafted PR body leads with Why (motivation for the migration/service change) before What (summary of changes).'

  - id: code_review_is_out_of_scope
    user_message: |
      Review PR #123 for bugs and leave inline review comments.
    must_not_include:
      - 'Bash: gh pr (create|edit).*'
    rubric:
      - 'The response recognizes that a code-review-only request is outside aa:create-pr and does not create or edit a PR.'
