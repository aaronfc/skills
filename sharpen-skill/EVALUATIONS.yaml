version: 1
scenarios:
  - id: keep_the_existing_contract
    user_message: |
      Sharpen ./triage. It already has evaluations. After the first cut, the
      test for asking about an unclear issue fails.
    rubric:
      - Uses sharpen.sh start to preserve the original and verifies each batch with the helper.
      - Repairs or reverts the cut and reruns the existing test without weakening it.
      - Shows the final diff and keeps the backup.

  - id: start_without_tests
    user_message: |
      Sharpen ./triage. There is no evaluation file. unvibe is installed.
    rubric:
      - Creates a small set of core behavior tests with the helper before cutting the skill.
      - Runs the new tests after reducing the skill and keeps them with the result.

  - id: missing_runner
    user_message: Please sharpen ./triage. unvibe is missing and I decline any download.
    rubric:
      - Honors the decision to skip both installation and uvx.
      - Offers judgment-only reduction or stops for my decision.
